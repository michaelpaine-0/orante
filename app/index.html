/* Layout: month grid as the Ordo page; a fixed "rubric" panel for the chosen day; list and key views below the same bar. */
:root{
  --bg:#f7f5f0; --panel:#fffdf9; --fg:#1f1b24; --muted:#6a6273; --line:#d9d3c7; --accent:#3b2a52; --accent-fg:#ffffff;
  --soft:#efeae0; --today:#c9a35b;
  --l-white:#f3efe6; --l-white-fg:#3a3630; --l-red:#a3241f; --l-green:#2f6b3a; --l-violet:#5a3b7a; --l-rose:#c96a8a; --l-black:#1a1a1a; --l-gold:#b8933b;
  --fast:#8a3b1c; --ind:#1d5c6e;
  --font-display:"EB Garamond",Georgia,"Times New Roman",serif;
  --font-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#16131b; --panel:#1f1a26; --fg:#ece7dd; --muted:#a69db0; --line:#36303f; --accent:#b9a2d6; --accent-fg:#1a1322; --soft:#272030; --today:#d8b86c;
  --l-white:#e7e1d4; --l-white-fg:#2b2823; --l-red:#c9443d; --l-green:#4c9a5a; --l-violet:#8d6cb3; --l-rose:#d98aa6; --l-black:#000000; --l-gold:#d4ad55;
  --fast:#e08a63; --ind:#6fc0d6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#16131b; --panel:#1f1a26; --fg:#ece7dd; --muted:#a69db0; --line:#36303f; --accent:#b9a2d6; --accent-fg:#1a1322; --soft:#272030; --today:#d8b86c;
  --l-white:#e7e1d4; --l-white-fg:#2b2823; --l-red:#c9443d; --l-green:#4c9a5a; --l-violet:#8d6cb3; --l-rose:#d98aa6; --l-black:#000000; --l-gold:#d4ad55;
  --fast:#e08a63; --ind:#6fc0d6; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 32px;max-width:1280px;margin:0 auto}
header.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-block:8px 12px;border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
h1{font-family:var(--font-display);font-weight:500;font-size:26px;margin:0;letter-spacing:.01em}
h1 small{font-family:var(--font-body);font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-left:10px;font-weight:600}
.nav{display:flex;align-items:center;gap:6px;margin-left:auto;flex-wrap:wrap}
button,select,input{font:inherit;color:var(--fg)}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer;line-height:1.2}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible,select:focus-visible,input:focus-visible,.cell:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
select{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.month-title{font-family:var(--font-display);font-size:22px;min-width:12ch;text-align:center}
.views{display:flex;gap:4px}
main{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:18px;margin-top:14px}
@media (max-width:960px){main{grid-template-columns:minmax(0,1fr)}}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:center;padding:4px 0;font-weight:600}
.cell{background:var(--panel);border:1px solid var(--line);border-radius:4px;min-height:92px;padding:5px 6px 6px;cursor:pointer;display:flex;flex-direction:column;gap:3px;position:relative;text-align:left;min-width:0}
.cell:hover{border-color:var(--accent)}
.cell.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.cell.empty{background:transparent;border-color:transparent;cursor:default}
.cell .d{display:flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:12px;font-variant-numeric:tabular-nums}
.cell .d .n{font-weight:500}
.cell.today .d .n{color:var(--today);font-weight:600}
.cell .d .cls{font-size:10px;color:var(--muted);margin-left:auto}
.cell .name{font-family:var(--font-display);font-size:13.5px;line-height:1.2;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.cell .name.sun{font-weight:600}
.swatch{width:10px;height:10px;border-radius:2px;border:1px solid rgba(0,0,0,.25);flex:none}
.tags{display:flex;flex-wrap:wrap;gap:3px;margin-top:auto}
.tag{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.04em;padding:1px 4px;border-radius:3px;border:1px solid var(--line);color:var(--muted);line-height:1.3}
.tag.hdo{border-color:var(--accent);color:var(--accent);font-weight:600}
.tag.fast{border-color:var(--fast);color:var(--fast)}
.tag.ind{border-color:var(--ind);color:var(--ind)}
.tag.mark{background:var(--soft)}
/* liturgical colors */
.sw-white{background:var(--l-white)}.sw-red{background:var(--l-red)}.sw-green{background:var(--l-green)}.sw-violet{background:var(--l-violet)}.sw-rose{background:var(--l-rose)}.sw-black{background:var(--l-black)}.sw-gold{background:var(--l-gold)}
/* detail panel */
aside.detail{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px 16px;align-self:start;position:sticky;top:calc(env(safe-area-inset-top,0px) + 64px);max-height:calc(100vh - 90px);overflow:auto;min-width:0}
@media (max-width:960px){aside.detail{position:static;max-height:none}}
.detail h2{font-family:var(--font-display);font-weight:500;font-size:22px;margin:0 0 2px;line-height:1.15;text-wrap:balance}
.detail .date{font-family:var(--font-mono);font-size:12px;color:var(--muted);margin-bottom:8px}
.band{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:4px;margin:8px 0;font-size:13px}
.band .lab{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.sec{margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.sec h3{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 6px;font-weight:600}
.sec p,.sec li{margin:0 0 4px}
.sec ul{margin:0;padding-left:18px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:13px}
.kv b{font-weight:600;color:var(--muted);font-size:12px}
.pl{color:var(--ind);font-weight:600}
.fa{color:var(--fast);font-weight:600}
.ref{font-family:var(--font-mono);font-size:10.5px;color:var(--muted)}
.note{font-size:12px;color:var(--muted)}
/* list view */
table.list{width:100%;border-collapse:collapse;font-size:13px}
.tablewrap{overflow-x:auto}
table.list th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line);position:sticky;top:calc(env(safe-area-inset-top,0px) + 62px);background:var(--bg)}
table.list td{padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.list tr.sun td{background:var(--soft)}
table.list td.d{font-family:var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
table.list td.nm{font-family:var(--font-display);font-size:14.5px}
table.list tr{cursor:pointer}
/* key view */
.key{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 14px;min-width:0}
.card h3{font-family:var(--font-display);font-weight:500;font-size:18px;margin:0 0 6px}
.card ul{padding-left:18px;margin:0}
.card li{margin-bottom:3px}
.sw-list{display:flex;flex-wrap:wrap;gap:8px}
.sw-list span{display:inline-flex;align-items:center;gap:6px}
.filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px;font-size:13px}
.filters label{display:inline-flex;align-items:center;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 8px;cursor:pointer}
.search{min-width:200px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
@media (prefers-reduced-motion:no-preference){.cell{transition:border-color .12s}}

  push(ctk,{kind:"feast",name:"Our Lord Jesus Christ the King",cls:1,color:"white",priv:true,pref:"Christ the King",ind:"ctk",isSun:true});
  // Advent
  const advNames=["Sunday I of Advent","Sunday II of Advent","Sunday III of Advent (Gaudete)","Sunday IV of Advent"];
  for(let i=0;i<4;i++)push(add(adv1,7*i),sun(advNames[i],1,i===2?"rose":"violet",{pref:"Trinity",season:"Advent"}));
  [3,5,6].forEach(k=>{const dt=add(adv1,14+k);push(dt,{kind:"ember",name:"Ember "+DOW[dt.getDay()]+" of Advent",cls:2,color:"violet",season:"Advent",pref:"Trinity",fast:"fastabs"})});
  push(D(y,12,24),{kind:"vigil",name:"Vigil of the Nativity",cls:1,color:"violet",priv:true,season:"Advent",pref:"Trinity",fast:"fastabs",mass:"Mass of the Vigil (violet, no Gloria). Midnight: First Mass of Christmas."});
  push(D(y,12,25),{kind:"feast",name:"Nativity of Our Lord Jesus Christ",cls:1,color:"white",priv:true,pref:"Nativity",hdo:true,mass:"Three Masses: Midnight (Dominus dixit), Dawn (Lux fulgebit), Day (Puer natus)."});
  [29,30,31].forEach(d=>push(D(y,12,d),{kind:"octave",name:"Day within the Octave of the Nativity",cls:2,color:"white",oct:"Christmas",pref:"Nativity",mass:"Mass Puer natus of Christmas Day"}));
  let sio=null;for(let d=26;d<=31;d++)if(D(y,12,d).getDay()===0){sio=D(y,12,d);break}
  if(sio)push(sio,sun("Sunday within the Octave of the Nativity",2,"white",{pref:"Nativity",oct:"Christmas"}));
  return {E,ash,sept,adv1,asc,ctk,leap,T,hf,hn,s3,unusedEp,pent:add(E,49),trin:add(E,56),corpus:add(E,60),sacred:add(E,68),lowsun:add(E,7)};
}

function seasonOf(dt,Y){
  const t=dt.getTime();
  const y=dt.getFullYear();
  if(t>=Y.adv1.getTime()&&t<D(y,12,25).getTime())return "Advent";
  if(t>=D(y,12,25).getTime()||t<=D(y,1,13).getTime())return "Christmastide";
  if(t<Y.sept.getTime())return "Time after Epiphany";
  if(t<Y.ash.getTime())return "Septuagesima";
  if(t<add(Y.E,-14).getTime())return "Lent";
  if(t<Y.E.getTime())return "Passiontide";
  if(t<=add(Y.E,55).getTime())return "Paschaltide";
  return "Time after Pentecost";
}
const SEASON_COLOR={Advent:"violet",Christmastide:"white","Time after Epiphany":"green",Septuagesima:"violet",Lent:"violet",Passiontide:"violet",Paschaltide:"white","Time after Pentecost":"green"};
const SEASON_PREF={Advent:"Common",Christmastide:"Nativity","Time after Epiphany":"Trinity (Sunday) / Common",Septuagesima:"Common",Lent:"Lent",Passiontide:"Holy Cross",Paschaltide:"Easter","Time after Pentecost":"Common"};

function lastSundayBefore(dt){const x=new Date(dt);while(x.getDay()!==0)x.setDate(x.getDate()-1);return x}

/* ---- core: compute one day */
function computeDay(dt,Y,opts){
  const y=dt.getFullYear(),m=dt.getMonth()+1,d=dt.getDate(),dow=dt.getDay();
  const season=seasonOf(dt,Y);
  const items=(Y.T[K(dt)]||[]).slice();
  const markers=items.filter(i=>i.marker);
  let temp=items.filter(i=>!i.marker).sort((a,b)=>a.cls-b.cls)[0];
  // default temporal
  if(!temp){
    if(dow===0)temp={kind:"sunday",name:"Sunday",cls:2,color:SEASON_COLOR[season]};
    else{
      let cls=4,name=null,mass=null;
      if(season==="Lent"||season==="Passiontide"){cls=3;name=DOW[dow]+" of "+(season==="Passiontide"?"Passion Week":"Lent");mass="Proper Mass of the feria (Lenten station)"}
      else if(season==="Advent"){cls=(m===12&&d>=17)?2:3;name=DOW[dow]+" of Advent";mass=(m===12&&d>=17)?"Mass of the preceding Sunday with the Advent 'O' antiphons; or Rorate (votive of BVM)":"Mass of the preceding Sunday"}
      else{mass=season==="Christmastide"?"Mass of Christmas Day (Puer natus)":"Mass of the preceding Sunday (or a votive / daily Mass for the dead)"}
      temp={kind:"feria",name:name||DOW[dow]+" (feria)",cls,color:SEASON_COLOR[season],season,mass};
    }
  }
  if(!temp.season)temp.season=season;
  if(!temp.name)temp.name=DOW[dow]+" (feria)";
  const otherSun=items.find(i=>i!==temp&&!i.marker&&i.kind==="sunday");
  // sanctoral
  let feasts=S.filter(s=>{
    let mm=s[0],dd=s[1];const fl=s[6]||"";
    if(fl.includes("leap")&&Y.leap)dd=dd+1;
    if(fl.includes("us")&&!fl.includes("nous")&&!opts.us)return false;
    if(fl.includes("nous")&&opts.us)return false;
    return mm===m&&dd===d;
  }).map(s=>({m:s[0],d:s[1],name:s[2],cls:s[3],color:s[4],comms:s[5]||[],flags:s[6]||""}));
  // transferred-in feasts
  (Y.transfers||[]).forEach(tr=>{if(K(tr.to)===K(dt))feasts.unshift(Object.assign({},tr.feast,{transferred:true,from:tr.from}))});
  let main=feasts.filter(f=>f.cls!=="c").sort((a,b)=>a.cls-b.cls)[0];
  const commOnly=feasts.filter(f=>f.cls==="c");
  let cel,comms=[],notes=[],massLine=null,choice=null,omitted=[];
  const isSunday=temp.kind==="sunday"||temp.isSun;
  const tcls=temp.cls;
    const privCommOf=t=>t.kind==="sunday"||t.cls===1||t.kind==="ember"||t.kind==="octave"&&t.oct==="Christmas"||t.season==="Lent"||t.season==="Passiontide"||t.season==="Advent"||t.kind==="vigil";
  if(otherSun)comms.push(otherSun.name);
  if(!main){ cel=temp; }
  else if(main.transferred){ cel=main; if(tcls<=3)comms.push(temp.name) }
  else if(tcls===1 && temp.priv){
    // class I temporal (privileged)
    if(main.cls===1){
      if(!main.transferredHandled){ // transfer forward
        cel=temp;omitted.push(main.name+" → transferred");
      }
    } else { cel=temp; omitted.push(main.name+(temp.nocomm?" (omitted)":" (omitted; no commemoration on this day)")); }
  }
  else if(tcls===1 && isSunday){ // class I Sunday (Advent, Lent, Passiontide, Low Sunday, Easter, Pentecost, Trinity)
    if(main.cls===1){cel=temp;omitted.push(main.name+" → transferred")}
    else {cel=temp;omitted.push(main.name+" (omitted this year)")}
  }
  else if(isSunday && tcls===2){
    if(main.cls===1 || (main.cls===2&&main.flags.includes("L"))){cel=main;comms.push(temp.name)}
    else if(main.cls===2){cel=temp;comms.push(main.name)}
    else {cel=temp;omitted.push(main.name+" (omitted this year)")}
  }
  else if(tcls===1){ // non-privileged class I temporal? (none) fallthrough
    cel=main.cls===1?main:temp; if(cel===main)comms.push(temp.name); else omitted.push(main.name+" (omitted)");
  }
  else if(tcls===2){ // class II feria/vigil/octave day (Ember, Dec 17–23, Christmas octave day, Vigil of Ascension)
    if(main.cls<=2){cel=main;comms.push(temp.name)}
    else {cel=temp;comms.push(main.name)}
  }
  else if(tcls===3){ // Lent/Passiontide/Advent feria
    if(main.cls<=2){cel=main;comms.push(temp.name)}
    else {cel=main;comms.push(temp.name);choice="Ad libitum: Mass of the feria with commemoration of "+main.name+", or Mass of the feast with commemoration of the feria.";}
  }
  else { // class IV feria
    cel=main;
  }
  // commemorations from sanctoral companions
  const limit = cel.cls===1 ? 0 : (cel.cls===2 ? 1 : 2);
  const privs=comms.slice(); // temporal comms (privileged) always
  let ordinary=[];
  if(cel===main){ ordinary=main.comms.slice(); }
  else if(main && cel!==main && !omitted.length && comms.includes(main.name)) ordinary=main.comms.slice();
  commOnly.forEach(c=>{ordinary.push(c.name);c.comms.forEach(x=>ordinary.push(x))});
  if(cel.cls===1 || isSunday){ /* class I days and Sundays: privileged commemorations only */ ordinary=[] }
  let final=privs.concat(ordinary);
  const maxTotal=cel.cls===1?(privs.length?privs.length:0):(cel.cls===2?Math.max(1,privs.length):Math.max(2,privs.length));
  if(cel.cls===1)final=privs; else final=final.slice(0,maxTotal);
  if(cel.nocomm)final=[];
  // markers (rogations) become commemorations/notes
  markers.forEach(mk=>{notes.push(mk.name+": "+mk.note)});
  // color
  let color=cel.color;
  // Mass line
  if(cel===temp){
    massLine=temp.mass||(temp.kind==="sunday"?"Proper Mass of the Sunday":temp.kind==="ember"?"Proper Mass of the Ember day":temp.kind==="vigil"?"Proper Mass of the Vigil":"Proper Mass of the day");
  } else {
    massLine=(main.transferred?"Mass of the feast (transferred from "+main.from+")":"Mass of the feast (Proper of Saints, "+d+" "+MON[m-1].slice(0,3)+", or Common)");
  }
  // preface
  let pref=cel.pref;
  if(!pref){
    if(cel===temp)pref=temp.kind==="sunday"?(season==="Time after Epiphany"||season==="Time after Pentecost"||season==="Septuagesima"?"Trinity":SEASON_PREF[season].split(" ")[0]):SEASON_PREF[season].split(" (")[0];
    else{
      const f=main.flags;
      if(f.includes("b"))pref="Blessed Virgin Mary";
      else if(f.includes("a")&&!/Evangelist|Mark|Luke/.test(main.name))pref="Apostles";
      else if(f.includes("a"))pref="Apostles";
      else if(f.includes("j"))pref="St Joseph";
      else if(f.includes("L")&&/Transfiguration|Baptism/.test(main.name))pref="Nativity";
      else if(f.includes("L")&&/Cross|Blood/.test(main.name))pref="Holy Cross";
      else if(f.includes("souls"))pref="of the Dead";
      else if(/Holy Family|Name of Jesus|Epiphany/.test(main.name))pref="Nativity";
      else pref= season==="Lent"?"Lent":season==="Passiontide"?"Holy Cross":season==="Paschaltide"?"Easter":season==="Christmastide"?"Nativity":"Common";
    }
  }
  // Gloria / Credo
  let gloria,credo;
  if(cel===temp){
    gloria=temp.gloria!==undefined?temp.gloria:(temp.kind==="sunday"&&!["Advent","Septuagesima","Lent","Passiontide"].includes(season))||temp.kind==="feast"||temp.kind==="octave"||(temp.kind==="feria"&&temp.cls===4&&season==="Paschaltide")||temp.name==="Ascension of Our Lord"||temp.name==="Maundy Thursday (In Cena Domini)";
    if(temp.kind==="ember"&&temp.oct==="Pentecost")gloria=true;
    credo=temp.kind==="sunday"||temp.cls===1&&temp.kind!=="feria"||temp.kind==="octave"||temp.isSun;
    if(temp.name&&/Good Friday|Holy Saturday|Ash Wednesday|Holy Week/.test(temp.name)){credo=false;gloria=false}
    if(temp.kind==="vigil"&&temp.color==="violet")gloria=false;
  } else {
    gloria=!(main.flags.includes("v")||main.flags.includes("souls"));
    credo=main.cls===1||main.flags.includes("a")||main.flags.includes("b")||main.flags.includes("d")||main.flags.includes("L")||main.flags.includes("j")||!!temp.oct;
    if(main.flags.includes("souls"))credo=false;
  }
  if(isSunday&&cel!==temp)credo=true;
  // Holy day
  const univHDO=(main&&main.flags.includes("hdo")&&cel===main)||(cel===temp&&!!temp.hdo)||isSunday;
  const usHDO=isSunday||(univHDO&&/^(Octave of the Nativity|Ascension|Assumption|All Saints|Immaculate Conception|Nativity of Our Lord)/.test(cel.name||""));
  const hdoName=univHDO&&!isSunday?cel.name:null;
  // fasting (1917 Code)
  let fast=null,fastNotes=[];
  const inLent=dt>=Y.ash&&dt<Y.E&&dow!==0;
  if(temp.fast)fast=temp.fast;
  if(inLent){ if(dow===5||dow===6||K(dt)===K(Y.ash))fast="fastabs"; else if(!fast)fast="fast"; }
  if(K(dt)===K(add(Y.E,-1)))fastNotes.push("Holy Saturday: fast and abstinence through the whole day (1957 rule; before 1957 it ended at noon).");
  // vigils with fast: Pentecost, Assumption (14 Aug), All Saints (31 Oct), Christmas (24 Dec)
  const vigFast=[[8,14,"Vigil of the Assumption"],[10,31,"Vigil of All Saints"],[12,24,"Vigil of the Nativity"]];
  vigFast.forEach(v=>{if(m===v[0]&&d===v[1]){if(dow===0)fastNotes.push(v[2]+": fast not anticipated (falls on Sunday).");else fast="fastabs"}});
  if(opts.strict){ // older custom (pre-1917): vigils of Apostles etc.
    const old=[[6,23,"Vigil of St John the Baptist"],[6,28,"Vigil of Sts Peter & Paul"],[7,24,"Vigil of St James"],[8,9,"Vigil of St Lawrence"],[8,23,"Vigil of St Bartholomew"],[9,20,"Vigil of St Matthew"],[10,27,"Vigil of Sts Simon & Jude"],[11,29,"Vigil of St Andrew"],[12,20,"Vigil of St Thomas"]];
    old.forEach(v=>{if(m===v[0]&&d===v[1]&&dow!==0&&!fast){fast="fastabs";fastNotes.push(v[2]+": fast by older custom (pre-1917).")}});
    if(season==="Advent"&&(dow===3)&&!fast){fast="abs";fastNotes.push("Advent Wednesday abstinence (older local custom).")}
  }
  if(dow===5&&!fast)fast="abs";
  // law ceases on Sundays and (outside Lent) on holy days of obligation
  if(dow===0)fast=null;
  if(hdoName&&!inLent&&fast){fastNotes.push("Law of fast/abstinence ceases: holy day of obligation outside Lent (c. 1252 §4).");fast=null}
  // indulgences
  let ind=[];
  const addI=k=>{(INDUL[k]||[]).forEach(x=>ind.push(x))};
  if(m===1&&d===25)addI("jan25");
  if(inLent&&dow===5&&dt<add(Y.E,-2))addI("lentfri");
  if(temp.ind)addI(temp.ind);
  if(m===6&&d===29)addI("jun29");
  if(m===8&&d===2)addI("aug2");
  if(m===11&&d>=1&&d<=8)addI("nov1_8");
  if(m===11&&d===2)addI("nov2");
  if(m===12&&d===31)addI("dec31");
  if(m===10&&d===31)notes.push("Vigil of All Saints: liturgical vigil dropped in 1955; the fast and abstinence remain under the 1917 Code.");
  // Vigil fast on 31 Oct note handled above
  return {dt,iso:iso(dt),dow,season,cel:{name:cel.name||temp.name,cls:cel.cls,kind:cel.kind||"feast"},color,comms:final,omitted,choice,massLine,pref,gloria,credo,
    isSunday,univHDO,usHDO,hdoName,fast,fastNotes,ind,notes,markers:markers.map(x=>x.name),
    ember:temp.kind==="ember",rogation:markers.length>0||temp.kind==="rogation",vigil:temp.kind==="vigil"||(main&&cel===main&&main.flags.includes("v"))||(main&&main.flags.includes("v")&&comms.includes(main.name)),
    octave:temp.oct||null,transferredIn:main&&main.transferred?main.from:null};
}

/* transfers of class I feasts impeded by class I days (computed once per year) */
function computeTransfers(Y,y,opts){
  Y.transfers=[];
  const probe=dt=>computeDay(dt,Y,opts);
  for(let m=1;m<=12;m++)for(let d=1;d<=31;d++){
    const dt=D(y,m,d);if(dt.getMonth()!==m-1)continue;
    const r=probe(dt);
    r.omitted.filter(o=>o.includes("→ transferred")).forEach(o=>{
      const name=o.replace(" → transferred","");
      const feast=S.find(s=>s[2]===name);if(!feast)return;
      let to=add(dt,1);
      for(let i=0;i<10;i++){const rr=probe(to);if(rr.cel.cls>=3||(rr.cel.cls===2&&rr.cel.kind==="feria"))break;to=add(to,1)}
      Y.transfers.push({from:d+" "+MON[m-1].slice(0,3),to,feast:{m,d,name:feast[2],cls:1,color:feast[4],comms:feast[5]||[],flags:feast[6]||""}});
    });
  }
}

  h+='<div class="sec"><h3>Fast &amp; abstinence (1917 Code)</h3>';
  h+=r.fast?'<p class="fa">'+FASTLAW[r.fast]+'</p>':'<p class="note">No fast or abstinence.</p>';
  if(r.fast==="fastabs"||r.fast==="fast")h+='<p class="note">Fast: ages 21–59; one full meal, two small collations; no eating between meals. Abstinence: from age 7; no flesh meat or broth. Eggs and dairy permitted.</p>';
  r.fastNotes.forEach(n=>h+='<p class="note">'+esc(n)+'</p>');
  h+='</div>';
  // Marks
  const marks=[];if(r.ember)marks.push("Ember day (fast and abstinence; ordinations)");if(r.rogation)marks.push(r.markers.join("; ")||"Rogation day");if(r.vigil)marks.push("Vigil");if(r.octave)marks.push("Within the Octave of "+r.octave);
  if(marks.length||r.notes.length){h+='<div class="sec"><h3>Marks</h3><ul>'+marks.map(x=>'<li>'+esc(x)+'</li>').join("")+r.notes.map(x=>'<li class="note">'+esc(x)+'</li>').join("")+'</ul></div>'}
  // Indulgences
  h+='<div class="sec"><h3>Indulgences</h3>';
  if(r.ind.length){h+='<ul>'+r.ind.map(x=>'<li><span class="pl">Plenary</span> — '+esc(x[1])+' <span class="ref">'+esc(x[2])+'</span></li>').join("")+'</ul>';}
  else h+='<p class="note">No date-specific grant.</p>';
  if(state.daily||!r.ind.length){h+='<p class="note" style="margin-top:6px"><b>Any day, plenary:</b></p><ul>'+DAILY_PLEN.map(x=>'<li class="note">'+esc(x[0])+' <span class="ref">'+esc(x[1])+'</span></li>').join("")+'</ul>';}
  h+='<p class="note" style="margin-top:6px">'+PLEN_COND+'</p>';
  h+='<p class="note"><b>Partial, any day:</b> '+esc(DAILY_PART.join(" "))+'</p>';
  h+='</div>';
  $("#detail").innerHTML=h;
}
function renderKey(){
  const yr=state.year;
  const f=dt=>DOW[dt.getDay()].slice(0,3)+" "+dt.getDate()+" "+MON[dt.getMonth()].slice(0,3);
  const E=Y.E;
  let h='';
  h+='<div class="card"><h3>Movable feasts '+yr+'</h3><ul>'+[
   ["Septuagesima",Y.sept],["Ash Wednesday",Y.ash],["Easter",E],["Low Sunday",Y.lowsun],["Ascension",Y.asc],["Pentecost",Y.pent],["Trinity Sunday",Y.trin],["Corpus Christi",Y.corpus],["Sacred Heart",Y.sacred],["Christ the King",Y.ctk],["Advent I",Y.adv1],["Holy Name of Jesus",Y.hn],["Holy Family",Y.hf]
  ].map(x=>'<li><b>'+x[0]+'</b> — '+f(x[1])+'</li>').join("")+'</ul></div>';
  h+='<div class="card"><h3>Ember &amp; Rogation days '+yr+'</h3><ul>'+[
   ["Ember (Lent)",[3,5,6].map(k=>f(add(E,-42+k))).join(", ")],["Ember (Pentecost)",[3,5,6].map(k=>f(add(E,49+k))).join(", ")],["Ember (September)",[3,5,6].map(k=>f(add(Y.s3,k))).join(", ")],["Ember (Advent)",[3,5,6].map(k=>f(add(Y.adv1,14+k))).join(", ")],["Major Litanies",f(D(yr,4,25))],["Minor Litanies",[36,37,38].map(k=>f(add(E,k))).join(", ")]
  ].map(x=>'<li><b>'+x[0]+'</b> — '+x[1]+'</li>').join("")+'</ul></div>';
  h+='<div class="card"><h3>Colors</h3><div class="sw-list">'+["white","red","green","violet","rose","black"].map(c=>'<span><span class="swatch sw-'+c+'"></span>'+c+'</span>').join("")+'</div><p class="note" style="margin-top:8px">Rose: Gaudete &amp; Laetare only. Black: Good Friday, All Souls, Masses for the dead. Gold may replace white, red or green on solemn days.</p></div>';
  h+='<div class="card"><h3>Ranks (Rubrics 1960)</h3><ul><li><b>I class</b> — greatest feasts, privileged Sundays, Holy Week, Easter &amp; Pentecost octaves. Only privileged commemorations.</li><li><b>II class</b> — most feasts of the Lord, BVM, Apostles; ordinary Sundays; Ember days; Advent 17–23 Dec; vigils of Ascension, St John, Sts Peter &amp; Paul, Assumption; Christmas octave days. One commemoration.</li><li><b>III class</b> — most saints; ferias of Lent, Passiontide, Advent to 16 Dec. Two commemorations.</li><li><b>IV class</b> — ordinary ferias (Mass of the preceding Sunday) and commemorations.</li></ul><p class="note">Octaves kept in 1962: Christmas, Easter, Pentecost only.</p></div>';
  h+='<div class="card"><h3>Holy days of obligation</h3><p><b>1917 Code (10):</b> Christmas, Circumcision, Epiphany, Ascension, Corpus Christi, Sts Peter &amp; Paul, Assumption, All Saints, Immaculate Conception, St Joseph — plus every Sunday.</p><p><b>USA (6):</b> 1 Jan, Ascension, 15 Aug, 1 Nov, 8 Dec, 25 Dec. Tags read <span class="tag hdo">HDO</span> when binding in the US and <span class="tag hdo">HDO·univ</span> when only on the universal list.</p></div>';
  h+='<div class="card"><h3>Fast &amp; abstinence (1917 Code, cc. 1250–54)</h3><ul><li><b>Abstinence</b> — every Friday.</li><li><b>Fast + abstinence</b> — Ash Wednesday; Fridays &amp; Saturdays of Lent; Holy Saturday; the 4 Ember weeks (Wed, Fri, Sat); vigils of Pentecost, Assumption, All Saints, Christmas.</li><li><b>Fast only</b> — Mon–Thu of Lent (meat at the main meal).</li><li>Sundays never bind. Outside Lent, a holy day of obligation lifts the law. Vigils are not anticipated.</li><li><b>Who:</b> fast 21–59; abstinence from 7. Fast = one full meal + two collations.</li></ul><p class="note">Toggle <i>Pre-1917 vigil fasts</i> to add the older vigils of the Apostles, St John the Baptist, St Lawrence, and Advent Wednesday abstinence.</p><p class="note"><b>Eucharistic fast:</b> 3 hours from solid food and alcohol, 1 hour from other liquids; water never breaks it (1957). Older custom: from midnight.</p></div>';
  h+='<div class="card"><h3>Indulgences — standing grants</h3><p>'+PLEN_COND+'</p><ul>'+DAILY_PLEN.map(x=>'<li>'+esc(x[0])+' <span class="ref">'+esc(x[1])+'</span></li>').join("")+'</ul><p class="note" style="margin-top:6px">Also plenary: visit to one\'s parish church on its titular feast or dedication anniversary, and to the cathedral on its titular feast (Grant 33 §1); renewal of baptismal promises on the anniversary of one\'s baptism (Grant 28 §1); first Holy Communion and attending one at it (Grant 8 §1 1°); papal blessing Urbi et Orbi, even by radio/TV/internet (Grant 4).</p><p class="note">Partial, any day: '+esc(DAILY_PART.join(" "))+'</p></div>';
  h+='<div class="card"><h3>Calendar feeds</h3><p>Orante ships as four subscribable calendar layers (.ics) that sit beside your work, school and family calendars:</p><ul><li><b>Orante · Feasts</b> — every day: celebration, rank, color, Mass notes.</li><li><b>Orante · Fasts</b> — fast and abstinence days, 6 pm reminder the evening before.</li><li><b>Orante · Holy days</b> — days of obligation, universal and US.</li><li><b>Orante · Indulgences</b> — plenary grants tied to a date, with conditions.</li></ul><p class="note">Subscribe once (webcal link) and updates arrive on their own. This page is the deep view behind each event.</p></div>';
  h+='<div class="card"><h3>Sources &amp; scope</h3><ul class="note"><li>Rubricae generales (1960) and Missale Romanum 1962, including US proper feasts.</li><li>Code of Canon Law 1917 for fast, abstinence and holy days; US list shown separately.</li><li>Enchiridion Indulgentiarum, 4th ed. (1999) with the 2002 Divine Mercy decree.</li><li>Christ the King and some indulgence dates follow the 1962 calendar here; check your ordinary for local transfers.</li><li>Local calendars (diocese, religious order) are not included.</li></ul></div>';
  $("#key").innerHTML=h;
}
function render(){
  ["month","list","key"].forEach(v=>{$("#view-"+v).hidden=state.view!==v});
  document.querySelectorAll("[data-view]").forEach(b=>b.classList.toggle("on",b.dataset.view===state.view));
  $("#detail").hidden=state.view==="key";
  if(state.view==="month")renderMonth();else if(state.view==="list")renderList();else renderKey();
  if(state.view!=="key")renderDetail();
  $("#year").value=String(state.year);
  $("#hint").textContent=state.year===2027?"2027 is computed by the same engine and not yet reviewed.":"";
  save();
}
document.addEventListener("click",e=>{
  const c=e.target.closest("[data-d]");if(c){state.sel=c.dataset.d;const dt=new Date(state.sel+"T12:00:00");state.month=dt.getMonth();render();if(window.innerWidth<=960)$("#detail").scrollIntoView({behavior:"smooth",block:"start"});return}
  const v=e.target.closest("[data-view]");if(v){state.view=v.dataset.view;render();return}
});
$("#prev").onclick=()=>{state.month--;if(state.month<0){state.month=11}render()};
$("#next").onclick=()=>{state.month++;if(state.month>11){state.month=0}render()};
$("#todayBtn").onclick=()=>{if(today.getFullYear()!==state.year){state.year=today.getFullYear()<=2026?2026:2027;rebuild()}state.month=today.getMonth();state.sel=iso(today);state.view="month";render()};
$("#year").onchange=e=>{state.year=+e.target.value;rebuild();state.sel=iso(D(state.year,state.month+1,1));render()};
$("#q").oninput=()=>render();
$("#optUS").onchange=e=>{state.us=e.target.checked;rebuild();render()};
$("#optStrict").onchange=e=>{state.strict=e.target.checked;rebuild();render()};
$("#optDaily").onchange=e=>{state.daily=e.target.checked;render()};
$("#optUS").checked=state.us;$("#optStrict").checked=state.strict;$("#optDaily").checked=state.daily;
rebuild();render();
</script>
