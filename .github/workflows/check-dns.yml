name: check-dns
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/check-dns.yml"]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve and fetch
        run: |
          {
          date -u
          for r in 1.1.1.1 8.8.8.8 9.9.9.9; do echo "== A orante.net @$r"; dig +short orante.net A @$r; done
          echo "== CNAME www @1.1.1.1"; dig +short www.orante.net CNAME @1.1.1.1
          echo "== NS"; dig +short orante.net NS @1.1.1.1
          echo "== http://orante.net headers"; curl -sS -o /dev/null -D - -m 20 http://orante.net/ | head -12 || true
          echo "== https://orante.net headers"; curl -sS -o /dev/null -D - -m 20 https://orante.net/ 2>&1 | head -12 || true
          echo "== title"; curl -sSL -m 20 http://orante.net/ | grep -o "<title>[^<]*" | head -1 || true
          for f in all feasts fasts holydays indulgences; do echo "== feed $f"; curl -sS -o /tmp/$f.ics -D - -m 20 https://orante.net/feeds/orante-$f.ics | grep -iE "^HTTP|content-type|content-length"; head -c 200 /tmp/$f.ics; echo; echo "events: $(grep -c BEGIN:VEVENT /tmp/$f.ics)"; done
          echo "== app"; curl -sS -o /dev/null -w "%{http_code} %{size_download}\n" -m 20 https://orante.net/app/
          echo "== favicon"; curl -sS -o /dev/null -w "%{http_code} %{content_type}\n" -m 20 https://orante.net/favicon.svg
          echo "== plates"; for p in master.webp master-hi.webp christ.png; do curl -sS -o /dev/null -w "$p %{http_code} %{size_download}\n" -m 60 https://orante.net/plates/$p; done
          } > status/dns.txt 2>&1 || true
          cat status/dns.txt
      - name: Commit result
        run: |
          git config user.name "orante-bot"; git config user.email "bot@orante.net"
          git add status/dns.txt; git commit -m "status: dns check" || exit 0; git push
